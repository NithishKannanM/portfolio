# Render fallback deploy.
#
# Deployed as a Node web service rather than a static site on purpose: a static
# export would drop /api/og, which generates social preview images at request
# time.
#
# Set the EmailJS variables in the Render dashboard (they're marked sync: false
# so they aren't committed here). None carry the NEXT_PUBLIC_ prefix on
# purpose — the contact route calls EmailJS server-side so the credentials
# never reach the browser.

services:
  - type: web
    name: nithishkannanm-portfolio
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
